<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Play Cinder Below and browse QinCai's browser games.">
  <title>QinCai's Games</title>
  <style>
    :root{color-scheme:dark;--ink:#f9eed7;--muted:#cbc0d3;--base:#231a32;--panel:#352640;--rule:#655370;--gold:#ffd48a}
    *{box-sizing:border-box}
    body{margin:0;background:var(--base);color:var(--ink);font:1rem/1.6 system-ui,sans-serif}
    .wrap{width:min(68rem,calc(100% - 2.5rem));margin-inline:auto}
    header{border-bottom:1px solid var(--rule);padding-block:1rem;font-weight:700}
    main{padding-block:clamp(2.5rem,7vw,6rem)}
    h1,h2{font-family:Georgia,serif;line-height:1;margin:0}
    h1{font-size:clamp(3rem,9vw,7rem);letter-spacing:-.065em}
    h2{font-size:clamp(2rem,5vw,3.6rem);letter-spacing:-.045em}
    p{color:var(--muted);max-width:36ch}
    article{display:grid;grid-template-columns:1.55fr 1fr;background:var(--panel);border:1px solid var(--rule);margin-top:2.5rem}
    .art{display:block;width:100%;height:100%;min-height:0;object-fit:cover;image-rendering:pixelated}
    .details{padding:clamp(1.35rem,4vw,3rem);align-self:center}
    .genre{margin-top:0;font-size:.875rem}
    .play{display:inline-block;background:var(--gold);color:#261932;padding:.65rem 1rem;font-weight:750;text-decoration:none}
    .play:hover{text-decoration:underline}
    a:focus-visible{outline:3px solid var(--ink);outline-offset:5px}
    footer{border-top:1px solid var(--rule);padding-block:1rem 2rem}
    footer a{color:var(--muted)}
    @media(max-width:44rem){article{grid-template-columns:1fr}.art{aspect-ratio:16/9}}
  </style>
</head>
<body>
  <header><div class="wrap">QinCai</div></header>
  <main class="wrap">
    <h1>Browser games</h1>
    <article aria-labelledby="cinder-title">
      <img class="art" src="./cinder-below-cover.png" alt="Pixel-art dungeon in Cinder Below" width="1280" height="720">
      <div class="details">
        <p class="genre">Dungeon roguelite</p>
        <h2 id="cinder-title">Cinder Below</h2>
        <p>Choose a keeper, fight through dungeon rooms, and pick up weapons along the way.</p>
        <a class="play" href="/cinder-below/">Play Cinder Below</a>
      </div>
    </article>
  </main>
  <footer><div class="wrap"><a href="https://github.com/QinCai-rui/games">Source on GitHub</a></div></footer>
</body>
</html>
